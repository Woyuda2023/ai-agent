server:
  port: 8080

spring:
  application:
    name: ai-knowledge-base

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

  # ========== MySQL：业务元数据（文档记录、会话列表） ==========
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rag_kb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123

  # 启动时自动执行建表 SQL（仅作用于 MySQL 主数据源）
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/init.sql
      continue-on-error: false

  # ========== Redis：多轮对话记录 ==========
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s

  # ========== Ollama：对话大模型 + Embedding 模型 ==========
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:7b        # 对话模型，需先 ollama pull qwen2.5:7b
          temperature: 0.7
      embedding:
        options:
          model: bge-m3            # Embedding 模型，需先 ollama pull bge-m3（1024 维）

# ========== PgVector：向量库（独立数据源，spring-ai 自动建表 vector_store） ==========
pgvector:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/rag_vector
    username: postgres
    password: postgres
  dimensions: 1024                # 必须与 embedding 模型输出维度一致（bge-m3=1024；nomic-embed-text=768）

# ========== RAG 业务参数 ==========
rag:
  chunk-size: 500                 # 分片大小（字符）
  overlap-size: 50                # 相邻分片重叠长度（字符），缓解语义断裂
  top-k: 10                       # 向量检索候选数
  top-n: 5                        # Rerank 重排后保留的上下文数量
  similarity-threshold: 0.3       # 余弦相似度阈值（低于该值的结果被过滤）
  upload-dir: ./uploads           # 文档本地存储目录
  rerank:
    enabled: true
    model: bge-reranker-v2-m3     # 重排序模型，需先 ollama pull bge-reranker-v2-m3
  session:
    max-messages: 20              # Redis 中单会话保留的最大消息条数（超限触发摘要压缩）
    summary-threshold: 16         # 摘要压缩时保留的最近消息条数

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.example.rag: debug
